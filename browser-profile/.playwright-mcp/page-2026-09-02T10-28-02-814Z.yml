                      - paragraph [ref=f6e2795]: 1. Shorten/customize the referral URL? Ideally, the link should include Ethos in the URL. The current link comes across as spam.
                      - paragraph [ref=f6e2796]: "Ans of 1: We can not make the shorten url dynamic. If we want more shorten url, we need to buy more domain. There would be a chance to the spam of the message. This spam is totally generated by the sim operator and twilio. More new domain will not help here."
                      - paragraph [ref=f6e2797]
                      - paragraph [ref=f6e2798]: If you want to send the sms with shorten url where ethos will be there, we need to create a short project like spa. Guru and we also buy new domain. Then you can do this. Please take an approval from Dr. Hardik.
