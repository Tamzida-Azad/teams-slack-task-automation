                          - text: ", shortly after her appointment was confirmed at 10:35 AM."
                      - paragraph [ref=f6e2915]:
                        - generic [ref=f6e2916]:
                          - text: About an hour later, at
                          - strong [ref=f6e2917]: 11:32 AM
                          - text: ", the system created a"
                          - strong [ref=f6e2918]: new service record
                          - text: for the same appointment and removed the original one that held her signed forms. After that, the signed consent records were also removed from the database. When staff opened her profile, it showed the new, empty service record — which is why HIPAA and consent appeared missing even though she had signed everything.
                      - paragraph [ref=f6e2919]:
                        - generic [ref=f6e2920]:
                          - strong [ref=f6e2921]: "Important:"
                          - text: This was
                          - strong [ref=f6e2922]: not
                          - text: caused by anything Juniper or your team did wrong. Her forms were signed successfully; the system failed to keep them linked to her profile afterward.
