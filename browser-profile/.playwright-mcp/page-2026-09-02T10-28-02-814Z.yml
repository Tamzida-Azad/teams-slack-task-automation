                      - paragraph [ref=f6e2802]
                      - paragraph [ref=f6e2803]
                      - paragraph [ref=f6e2804]: 2. Allow the patient to simply share their unique link directly, so the person they refer can click it and fill out their own information?
                      - paragraph [ref=f6e2805]: "Ans of 2: It can not be dynamic. For each unique link we need to purchase new domain which will be costlier. and we also need to host the short project too which will also have some cost."
